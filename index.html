<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>学习打卡</title>
<style>*{margin:0;padding:0}body{display:flex;justify-content:center;align-items:center;height:100vh;background:#667eea;color:#fff;font-family:sans-serif}</style>
</head>
<body>
<div style="text-align:center">
<div style="font-size:24px;margin-bottom:10px">📚 加载中...</div>
<div style="font-size:13px;opacity:.7">正在打开学习App</div>
</div>
<script>
// 从 JSDelivr CDN 加载真正的 App
fetch("https://cdn.jsdelivr.net/gh/zjb6668/zjb6668.github.io/app.html")
  .then(r=>r.text())
  .then(html=>{
    document.open();
    document.write(html);
    document.close();
  })
  .catch(()=>{
    // 如果 CDN 也挂了，尝试 fastly 节点
    fetch("https://fastly.jsdelivr.net/gh/zjb6668/zjb6668.github.io/app.html")
      .then(r=>r.text())
      .then(html=>{document.open();document.write(html);document.close();})
      .catch(()=>{
        document.body.innerHTML='<div style="text-align:center"><div style="font-size:18px;margin-bottom:10px">😵 加载失败</div><div style="font-size:13px;opacity:.7">请检查网络后刷新</div><br><button onclick="location.reload()" style="padding:10px 30px;border:none;border-radius:20px;background:#fff;color:#667eea;font-size:14px;cursor:pointer">重新加载</button></div>';
      });
  });
</script>
</body>
</html>
