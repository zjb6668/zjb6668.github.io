<title>乘务英语实战手册 · 佳蓓专属</title>
<style>
:root {
  --bg: #f8f7f5;
  --card: #ffffff;
  --text: #2a2825;
  --text-light: #9a958a;
  --accent: #1a4d8f;
  --accent-light: #4a7ab5;
  --accent-bg: #e8f0fa;
  --green: #4a7c3f;
  --green-bg: #edf5ea;
  --red: #b04040;
  --red-bg: #fbeaea;
  --orange: #c47530;
  --orange-bg: #fdf3e8;
  --border: #e8e3db;
  --shadow: 0 1px 8px rgba(26,77,143,0.05);
  --tag: #f0ede8;
}
[data-theme="dark"] {
  --bg: #121110;
  --card: #1e1c1a;
  --text: #ddd8d0;
  --text-light: #6a655a;
  --accent: #5a8fc5;
  --accent-light: #7aaad5;
  --accent-bg: #1a2a3a;
  --green: #7a9a6a;
  --green-bg: #1a2a1a;
  --red: #c06060;
  --red-bg: #2a1a1a;
  --orange: #c4955a;
  --orange-bg: #2a2515;
  --border: #2c2926;
  --shadow: 0 1px 8px rgba(0,0,0,0.3);
  --tag: #282523;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, "PingFang SC", "SF Pro Display", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  font-size: 15px;
  transition: background 0.3s, color 0.3s;
}
.theme-btn {
  position: fixed; top: 14px; right: 14px;
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.15);
  color: #fff; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 100; backdrop-filter: blur(8px);
}
.hero {
  background: linear-gradient(135deg, #1a4d8f 0%, #0d3060 50%, #061d3a 100%);
  color: #fff;
  padding: 50px 24px 40px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: -20%; right: -10%;
  width: 60%; height: 80%;
  background: radial-gradient(ellipse, rgba(74,122,181,0.15) 0%, transparent 70%);
}
.hero::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 30px; background: linear-gradient(180deg, transparent, var(--bg));
}
.hero .icon { font-size: 36px; margin-bottom: 10px; position: relative; }
.hero h1 { font-size: 22px; font-weight: 600; letter-spacing: 3px; position: relative; margin-bottom: 6px; }
.hero .sub { font-size: 12px; opacity: 0.6; letter-spacing: 4px; position: relative; }
.hero .desc { font-size: 13px; opacity: 0.55; margin-top: 14px; line-height: 1.8; position: relative; }

/* Tab bar */
.tab-bar {
  display: flex;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--card);
  position: sticky; top: 0; z-index: 50;
  border-bottom: 1px solid var(--border);
  scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  padding: 13px 14px;
  font-size: 12px;
  color: var(--text-light);
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  letter-spacing: 1px;
}
.tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 600;
}

.scene { display: none; padding: 12px; animation: fadeIn 0.3s; }
.scene.active { display: block; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.scene-title {
  text-align: center;
  margin: 10px 0 16px;
}
.scene-title h2 { font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: 2px; }
.scene-title p { font-size: 11px; color: var(--text-light); margin-top: 4px; }

/* Dialogue card */
.dlg {
  background: var(--card);
  border-radius: 14px;
  margin-bottom: 10px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.dlg-header {
  padding: 10px 14px;
  background: var(--accent-bg);
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 6px;
}
.dlg-header.green { background: var(--green-bg); color: var(--green); }
.dlg-header.red { background: var(--red-bg); color: var(--red); }
.dlg-header.orange { background: var(--orange-bg); color: var(--orange); }
.dlg-body { padding: 12px 14px; }
.dlg-line { margin-bottom: 10px; }
.dlg-line:last-child { margin-bottom: 0; }
.dlg-label {
  font-size: 10px;
  color: var(--text-light);
  margin-bottom: 3px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.dlg-en {
  font-size: 14px;
  color: var(--text);
  font-weight: 500;
  line-height: 1.5;
  margin-bottom: 4px;
}
.dlg-zh {
  font-size: 12px;
  color: var(--text-light);
  line-height: 1.5;
}
.dlg-divider {
  height: 1px;
  background: var(--border);
  margin: 10px 0;
}

/* Tip box */
.tip {
  background: var(--card);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
  border-left: 3px solid var(--accent);
  box-shadow: var(--shadow);
}
.tip-label { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
.tip-text { font-size: 13px; color: var(--text); line-height: 1.8; }

/* Quick reference list */
.quick-list {
  background: var(--card);
  border-radius: 14px;
  margin-bottom: 10px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.quick-item {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}
.quick-item:last-child { border-bottom: none; }
.quick-en { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 3px; }
.quick-zh { font-size: 12px; color: var(--text-light); }

.footer { text-align: center; padding: 24px; font-size: 11px; color: var(--text-light); }
</style>
</head>

// ========== RENDER ==========
var tabBar = document.getElementById('tabBar');
var content = document.getElementById('content');

scenes.forEach(function(scene, i) {
  // Tab
  var tab = document.createElement('div');
  tab.className = 'tab' + (i === 0 ? ' active' : '');
  tab.textContent = scene.tab;
  tab.onclick = function() { switchTab(this, i); };
  tabBar.appendChild(tab);

  // Scene container
  var div = document.createElement('div');
  div.className = 'scene' + (i === 0 ? ' active' : '');
  div.dataset.index = i;

  // Title
  var title = document.createElement('div');
  title.className = 'scene-title';
  title.innerHTML = '<h2>' + scene.title + '</h2><p>' + scene.sub + '</p>';
  div.appendChild(title);

  // Items
  scene.items.forEach(function(item) {
    if (item.type === 'dlg') {
      var card = document.createElement('div');
      card.className = 'dlg';
      var header = document.createElement('div');
      header.className = 'dlg-header ' + (item.color === 'green' ? 'green' : item.color === 'red' ? 'red' : item.color === 'orange' ? 'orange' : '');
      header.textContent = item.header;
      card.appendChild(header);

      var body = document.createElement('div');
      body.className = 'dlg-body';
      item.lines.forEach(function(line, j) {
        if (j > 0) {
          var d = document.createElement('div');
          d.className = 'dlg-divider';
          body.appendChild(d);
        }
        var lineDiv = document.createElement('div');
        lineDiv.className = 'dlg-line';
        lineDiv.innerHTML = '<div class="dlg-label">' + line.label + '</div><div class="dlg-en">' + line.en + '</div><div class="dlg-zh">' + line.zh + '</div>';
        body.appendChild(lineDiv);
      });
      card.appendChild(body);
      div.appendChild(card);
    } else if (item.type === 'tip') {
      var tip = document.createElement('div');
      tip.className = 'tip';
      tip.innerHTML = '<div class="tip-label">' + item.label + '</div><div class="tip-text">' + item.text + '</div>';
      div.appendChild(tip);
    } else if (item.type === 'quick') {
      var ql = document.createElement('div');
      ql.className = 'quick-list';
      var qTitle = document.createElement('div');
      qTitle.style.cssText = 'padding:10px 14px;background:var(--accent-bg);font-size:13px;font-weight:600;color:var(--accent);';
      qTitle.textContent = item.title;
      ql.appendChild(qTitle);
      item.items.forEach(function(qi) {
        var q = document.createElement('div');
        q.className = 'quick-item';
        q.innerHTML = '<div class="quick-en">' + qi.en + '</div><div class="quick-zh">' + qi.zh + '</div>';
        ql.appendChild(q);
      });
      div.appendChild(ql);
    }
  });

  content.appendChild(div);
});

function switchTab(el, index) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  el.classList.add('active');
  document.querySelectorAll('.scene').forEach(function(s) { s.classList.remove('active'); });
  document.querySelector('.scene[data-index="' + index + '"]').classList.add('active');
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  window.scrollTo(0, 0);
}

function toggleTheme() {
  var cur = document.documentElement.getAttribute('data-theme');
  if (cur === 'dark') {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('theme', 'light');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('theme', 'dark');
  }
}

var saved = localStorage.getItem('theme');
if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
else if (!saved) { var h = new Date().getHours(); if (h >= 18 || h < 7) document.documentElement.setAttribute('data-theme', 'dark'); }
</script>
