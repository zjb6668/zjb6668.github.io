<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>佳蓓的审美图鉴</title>
<style>
:root {
  --bg: #f5f3f0;
  --card: #ffffff;
  --text: #2c2825;
  --text-light: #9a9288;
  --accent: #8b7d6b;
  --accent-dark: #6b5d4f;
  --border: #e8e2d8;
  --shadow: 0 2px 12px rgba(139,125,107,0.06);
}
[data-theme="dark"] {
  --bg: #161412;
  --card: #221f1c;
  --text: #e8e2d8;
  --text-light: #7a7268;
  --accent: #c4b8a4;
  --accent-dark: #a49680;
  --border: #332e2a;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, "PingFang SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  font-size: 14px;
  transition: background 0.3s, color 0.3s;
}
/* Hero */
.hero {
  background: linear-gradient(135deg, #6b5d4f 0%, #4a3f35 50%, #2c2825 100%);
  color: #fff;
  padding: 50px 24px 36px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 40px;
  background: linear-gradient(180deg, transparent, var(--bg));
}
.hero h1 { font-size: 26px; font-weight: 300; letter-spacing: 6px; margin-bottom: 6px; }
.hero .sub { font-size: 13px; opacity: 0.7; letter-spacing: 3px; }
.hero .tags { margin-top: 14px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.hero .tag {
  font-size: 11px;
  padding: 3px 10px;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 16px;
  letter-spacing: 1px;
}
.theme-btn {
  position: fixed;
  top: 14px; right: 14px;
  width: 34px; height: 34px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 100;
  backdrop-filter: blur(8px);
}
/* Tab bar */
.tab-bar {
  display: flex;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--card);
  position: sticky;
  top: 0;
  z-index: 50;
  border-bottom: 1px solid var(--border);
  scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  padding: 14px 16px;
  font-size: 13px;
  color: var(--text-light);
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 600;
}
/* Scene section */
.scene {
  display: none;
  padding: 12px;
  animation: fadeIn 0.3s;
}
.scene.active { display: block; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.scene-header {
  text-align: center;
  margin: 8px 0 16px;
}
.scene-header h2 {
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 2px;
}
.scene-header p {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 4px;
}
/* Masonry grid */
.grid {
  column-count: 2;
  column-gap: 10px;
}
.card {
  break-inside: avoid;
  margin-bottom: 10px;
  background: var(--card);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: var(--shadow);
  position: relative;
}
.card img {
  width: 100%;
  display: block;
  transition: opacity 0.3s;
}
.card img.loading { opacity: 0; }
.card img.loaded { opacity: 1; }
.card .desc {
  padding: 8px 12px;
  font-size: 12px;
  color: var(--text-light);
  line-height: 1.4;
}
.card .placeholder {
  width: 100%;
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  background: linear-gradient(135deg, var(--border), var(--card));
}
/* Keywords section */
.keywords-section {
  background: var(--card);
  margin: 12px;
  border-radius: 16px;
  padding: 20px 16px;
  box-shadow: var(--shadow);
}
.kw-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--text);
  padding-left: 10px;
  border-left: 3px solid var(--accent);
}
.kw-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.kw {
  font-size: 12px;
  padding: 5px 11px;
  background: var(--bg);
  border-radius: 8px;
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.kw:active { transform: scale(0.93); background: var(--accent); color: #fff; }
.kw.copied { background: var(--accent); color: #fff; }
/* Style card */
.style-card {
  background: var(--card);
  margin: 12px;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.style-card-header {
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: #fff;
  padding: 20px;
  text-align: center;
}
.style-card-header h3 { font-size: 16px; letter-spacing: 3px; font-weight: 400; }
.style-card-body { padding: 20px 16px; }
.style-row {
  display: flex;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}
.style-row:last-child { border-bottom: none; }
.style-label {
  flex-shrink: 0;
  width: 70px;
  font-size: 12px;
  color: var(--text-light);
}
.style-value {
  flex: 1;
  font-size: 13px;
  color: var(--text);
  font-weight: 500;
}
.quote {
  text-align: center;
  padding: 30px 24px;
  font-size: 15px;
  color: var(--accent);
  font-style: italic;
  line-height: 1.8;
}
.toast {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.8);
  color: #fff;
  padding: 10px 20px;
  border-radius: 24px;
  font-size: 12px;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
.footer {
  text-align: center;
  padding: 20px;
  font-size: 11px;
  color: var(--text-light);
}
</style>
</head>
<body>

<button class="theme-btn" onclick="toggleTheme()">🌓</button>

<div class="hero">
  <h1>佳蓓的审美图鉴</h1>
  <div class="sub">清冷文艺法式 · 高级感少女</div>
  <div class="tags">
    <span class="tag">170cm</span>

    <span class="tag">冷白调</span>
    <span class="tag">窄肩圆脸</span>
  </div>
</div>

<div class="tab-bar" id="tabBar"></div>
<div id="content"></div>

<div class="quote">

</div>
<div class="footer">佳蓓的审美图鉴 · 2026</div>

function imgFallback(img) {
  var emoji = img.dataset.emoji || '👗';
  var div = document.createElement('div');
  div.className = 'placeholder';
  div.textContent = emoji;
  img.parentNode.replaceChild(div, img);
}

function createCard(img, emoji) {
  var card = document.createElement('div');
  card.className = 'card';
  var im = document.createElement('img');
  im.src = img.url;
  im.loading = 'lazy';
  im.dataset.emoji = emoji;
  im.className = 'loading';
  im.onload = function() { this.classList.remove('loading'); this.classList.add('loaded'); };
  im.onerror = function() { imgFallback(this); };
  card.appendChild(im);
  var desc = document.createElement('div');
  desc.className = 'desc';
  desc.textContent = img.desc;
  card.appendChild(desc);
  return card;
}

function renderScene(scene, index) {
  var container = document.createElement('div');
  container.className = 'scene' + (index === 0 ? ' active' : '');
  container.dataset.index = index;

  var header = document.createElement('div');
  header.className = 'scene-header';
  header.innerHTML = '<h2>' + scene.emoji + ' ' + scene.name + '</h2><p>点击图片长按可保存 · 左右滑动切换分类</p>';
  container.appendChild(header);

  var grid = document.createElement('div');
  grid.className = 'grid';
  scene.images.forEach(function(img) {
    grid.appendChild(createCard(img, scene.emoji));
  });
  container.appendChild(grid);

  // Add keywords for matching scenes
  var kwKeys = {};
  if (keywords[scene.name]) kwKeys = {};
  
  return container;
}

function renderKeywords() {
  var container = document.createElement('div');
  container.className = 'scene active';
  container.dataset.index = 'keywords';

  var header = document.createElement('div');
  header.className = 'scene-header';
  header.innerHTML = '<h2>🔍 搜索关键词</h2><p>点击复制 · 粘贴到小红书搜索框</p>';
  container.appendChild(header);

  var section = document.createElement('div');
  section.className = 'keywords-section';
  
  for (var cat in keywords) {
    var title = document.createElement('div');
    title.className = 'kw-title';
    title.textContent = cat;
    section.appendChild(title);
    
    var grid = document.createElement('div');
    grid.className = 'kw-grid';
    keywords[cat].forEach(function(k) {
      var span = document.createElement('span');
      span.className = 'kw';
      span.textContent = k;
      span.onclick = function() { copyText(this, k); };
      grid.appendChild(span);
    });
    section.appendChild(grid);
  }
  container.appendChild(section);
  return container;
}

function renderStyleCard() {
  var container = document.createElement('div');
  container.className = 'scene';
  container.dataset.index = 'style';

  var header = document.createElement('div');
  header.className = 'scene-header';
  header.innerHTML = '<h2>🪪 风格定位卡</h2><p>购物、搭配前先看一眼</p>';
  container.appendChild(header);

  var card = document.createElement('div');
  card.className = 'style-card';
  
  var cardHeader = document.createElement('div');
  cardHeader.className = 'style-card-header';
  cardHeader.innerHTML = '<h3>佳蓓的风格名片</h3>';
  card.appendChild(cardHeader);

  var body = document.createElement('div');
  body.className = 'style-card-body';
  for (var key in styleCard) {
    var row = document.createElement('div');
    row.className = 'style-row';
    row.innerHTML = '<div class="style-label">' + key + '</div><div class="style-value">' + styleCard[key] + '</div>';
    body.appendChild(row);
  }
  card.appendChild(body);
  container.appendChild(card);
  return container;
}

content.appendChild(renderKeywords());

function switchTab(el, target) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  el.classList.add('active');
  document.querySelectorAll('.scene').forEach(function(s) { s.classList.remove('active'); });
  if (target === 'keywords') {
    document.querySelector('.scene[data-index="keywords"]').classList.add('active');
  } else if (target === 'style') {
    document.querySelector('.scene[data-index="style"]').classList.add('active');
  } else {
    document.querySelector('.scene[data-index="' + target + '"]').classList.add('active');
  }
  // Scroll tab into view
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  window.scrollTo(0, 0);
}

function copyText(el, text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    var toast = document.getElementById('toast');
    toast.textContent = '已复制：' + text;
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 2000);
    el.classList.add('copied');
    setTimeout(function() { el.classList.remove('copied'); }, 1000);
  } catch(e) {}
  document.body.removeChild(ta);
}

function toggleTheme() {
  var cur = document.documentElement.getAttribute('data-theme');
  if (cur === 'dark') {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('theme', 'light');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('theme', 'dark');
  }
}

var saved = localStorage.getItem('theme');
if (saved === 'dark') {
  document.documentElement.setAttribute('data-theme', 'dark');
} else if (!saved) {
  var h = new Date().getHours();
  if (h >= 18 || h < 7) document.documentElement.setAttribute('data-theme', 'dark');
}
</script>
