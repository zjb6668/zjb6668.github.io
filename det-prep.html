* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, "PingFang SC", sans-serif;

}
.theme-btn {
  position: fixed; top: 14px; right: 14px;
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.15);

  display: flex; align-items: center; justify-content: center;

.hero {

}
.hero::before {

.tab-bar {
  display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch;
  background: var(--card); position: sticky; top: 0; z-index: 50;
  border-bottom: 1px solid var(--border); scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0; padding: 13px 14px; font-size: 12px;

}

.scene { display: none; padding: 12px; animation: fadeIn 0.3s; }
.scene.active { display: block; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.scene-title { text-align: center; margin: 10px 0 16px; }

.card-box {

.card-header {

.card-header.green { background: var(--green-bg); color: var(--green); }
.card-header.red { background: var(--red-bg); color: var(--red); }

.qtype-body { padding: 14px; }
.qtype-row { display: flex; gap: 8px; margin-bottom: 6px; font-size: 12px; }
.qtype-label { color: var(--text-light); flex-shrink: 0; width: 70px; }
.qtype-value { color: var(--text); flex: 1; }
.qtype-tip {
  margin-top: 8px; padding: 10px 12px; background: var(--green-bg);
  border-radius: 10px; font-size: 12px; color: var(--green); line-height: 1.8;
}

  background: var(--card); border-radius: 12px; padding: 14px;

}
.tip-label { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
.tip-text { font-size: 13px; color: var(--text); line-height: 1.9; }

.template {
  background: var(--card); border-radius: 12px; padding: 14px;
  margin-bottom: 10px; box-shadow: var(--shadow);

.template-title { font-size: 13px; font-weight: 700; color: var(--green); margin-bottom: 8px; }
.template-en { font-size: 13px; color: var(--text); line-height: 1.8; margin-bottom: 6px; font-style: italic; }
.template-zh { font-size: 11px; color: var(--text-light); line-height: 1.6; }

.schedule-header.w2 { background: var(--accent-bg); color: var(--accent); }

.day-plan { margin-bottom: 10px; }
.day-plan:last-child { margin-bottom: 0; }
.day-label { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
.day-text { font-size: 12px; color: var(--text); line-height: 1.8; }

.footer { text-align: center; padding: 24px; font-size: 11px; color: var(--text-light); }
</style>

  var tab = document.createElement('div');
  tab.className = 'tab' + (i === 0 ? ' active' : '');
  tab.textContent = scene.tab;
  tab.onclick = function() { switchTab(this, i); };
  tabBar.appendChild(tab);

  var div = document.createElement('div');
  div.className = 'scene' + (i === 0 ? ' active' : '');
  div.dataset.index = i;

  var title = document.createElement('div');
  title.className = 'scene-title';
  title.innerHTML = '<h2>' + scene.title + '</h2><p>' + scene.sub + '</p>';
  div.appendChild(title);

  scene.items.forEach(function(item) {
    if (item.type === 'card') {
      var c = document.createElement('div');
      c.className = 'card-box';
      var h = document.createElement('div');
      h.className = 'card-header ' + (item.color || 'purple');
      h.textContent = item.header;
      c.appendChild(h);
      var b = document.createElement('div');
      b.className = 'card-body';
      b.innerHTML = item.body;
      c.appendChild(b);
      div.appendChild(c);

      var t = document.createElement('div');
      t.className = 'tip-box';
      t.innerHTML = '<div class="tip-label">' + item.label + '</div><div class="tip-text">' + item.text + '</div>';

      var tp = document.createElement('div');
      tp.className = 'template';
      tp.innerHTML = '<div class="template-title">' + item.title + '</div>' +
        '<div class="template-en">' + item.en + '</div>' +
        '<div class="template-zh">' + item.zh + '</div>' +
        (item.tip ? '<div style="margin-top:8px;padding:8px 10px;background:var(--orange-bg);border-radius:8px;font-size:11px;color:#c47530;">💡 ' + item.tip + '</div>' : '');
      div.appendChild(tp);
    } else if (item.type === 'qtype') {
      var qt = document.createElement('div');
      qt.className = 'qtype';
      qt.innerHTML = '<div class="qtype-header"><div class="qtype-name">' + item.name + '</div><div class="qtype-badge">' + item.badge + '</div></div>' +
        '<div class="qtype-body">' +
        '<div class="qtype-row"><div class="qtype-label">单项分</div><div class="qtype-value">' + item.subscore + '</div></div>' +
        '<div class="qtype-row"><div class="qtype-label">考查内容</div><div class="qtype-value">' + item.desc + '</div></div>' +
        '<div class="qtype-tip">💡 ' + item.tip + '</div>' +
        '</div>';
      div.appendChild(qt);
    } else if (item.type === 'schedule') {
      var sc = document.createElement('div');
      sc.className = 'schedule';
      var sh = document.createElement('div');
      sh.className = 'schedule-header ' + item.color;
      sh.textContent = item.header;
      sc.appendChild(sh);
      var sb = document.createElement('div');
      sb.className = 'schedule-body';
      item.days.forEach(function(d) {
        var dp = document.createElement('div');
        dp.className = 'day-plan';
        dp.innerHTML = '<div class="day-label">' + d.label + '</div><div class="day-text">' + d.text + '</div>';
        sb.appendChild(dp);
      });
      sc.appendChild(sb);
      div.appendChild(sc);
    }
  });

  content.appendChild(div);
});

function switchTab(el, index) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  el.classList.add('active');
  document.querySelectorAll('.scene').forEach(function(s) { s.classList.remove('active'); });
  document.querySelector('.scene[data-index="' + index + '"]').classList.add('active');
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  window.scrollTo(0, 0);
}

function toggleTheme() {
  var cur = document.documentElement.getAttribute('data-theme');
  if (cur === 'dark') { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme','light'); }
  else { document.documentElement.setAttribute('data-theme','dark'); localStorage.setItem('theme','dark'); }
}
var saved = localStorage.getItem('theme');
if (saved === 'dark') document.documentElement.setAttribute('data-theme','dark');
else if (!saved) { var h = new Date().getHours(); if (h >= 18 || h < 7) document.documentElement.setAttribute('data-theme','dark'); }
</script>
